<body class="bg-background text-on-background font-body-md antialiased min-h-screen relative overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Background (Dimmed by overlay later) -->
<div class="h-screen w-full relative flex flex-col">
<!-- TopAppBar (Checkout Specific) -->
<header class="flex justify-between items-center px-container-padding h-16 w-full border-b border-outline-variant/20 bg-surface/80 backdrop-blur-lg sticky top-0 z-10">
<div class="flex items-center gap-4">
<button class="text-on-surface hover:text-primary-fixed transition-colors active:scale-90 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display font-bold text-h2 text-on-surface tracking-tight">Checkout</h1>
</div>
</header>
<!-- Checkout Canvas Area (Simulated content behind the modal) -->
<main class="flex-1 overflow-y-auto p-container-padding space-y-stack-lg">
<!-- Order Summary Card -->
<div class="bg-surface-container-low rounded-xl border border-outline-variant/20 p-stack-lg flex flex-col gap-stack-sm">
<div class="flex items-start justify-between">
<div>
<h2 class="font-h2 text-h2 text-on-surface">Downtown Padel Arena</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Court 3 • Premium Glass</p>
</div>
</div>
<div class="flex items-center gap-2 text-on-surface-variant mt-stack-md bg-surface-container-highest/50 p-3 rounded-lg w-fit">
<span class="material-symbols-outlined" style="font-size: 20px;">calendar_today</span>
<span class="font-body-md text-body-md">Sat, 24 Oct • 18:00 - 19:30</span>
</div>
<div class="border-t border-outline-variant/20 mt-stack-md pt-stack-md flex justify-between items-end">
<span class="font-body-lg text-body-lg text-on-surface-variant">Total Amount</span>
<span class="font-h1 text-h1 text-on-surface">₹ 2,400</span>
</div>
</div>
<!-- Payment Method Preview -->
<div class="bg-surface-container-low rounded-xl border border-outline-variant/20 p-stack-lg flex items-center justify-between opacity-50">
<div class="flex items-center gap-4">
<div class="w-12 h-8 bg-surface rounded flex items-center justify-center border border-outline-variant/40">
<span class="material-symbols-outlined text-on-surface-variant">credit_card</span>
</div>
<span class="font-body-md text-body-md text-on-surface">•••• 4242</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</main>
</div>
<!-- Background Dim Overlay -->
<div class="fixed inset-0 bg-surface-dim/90 backdrop-blur-md z-40 transition-opacity duration-300"></div>
<!-- Bottom Sheet Pop-up -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container rounded-t-[32px] p-container-padding pb-[calc(24px+env(safe-area-inset-bottom))] z-50 flex flex-col gap-stack-lg shadow-[0_-10px_40px_rgba(0,0,0,0.5)] border-t border-outline-variant/10 transform transition-transform duration-300 translate-y-0">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto absolute top-4 left-1/2 -translate-x-1/2"></div>
<!-- Sheet Header -->
<div class="text-center mt-stack-md">
<h2 class="font-display text-h1 text-on-surface mb-stack-sm tracking-tight">Enter Code</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sent to +91 98765 43210</p>
</div>
<!-- OTP Input Area -->
<div class="flex justify-center my-stack-sm gap-2"><!-- Active Input -->
<input class="w-12 h-14 sm:w-16 sm:h-20 bg-surface-container-lowest border-2 border-primary-fixed rounded-xl text-center font-display text-h1 sm:text-display text-on-surface focus:outline-none focus:ring-0 selection:bg-transparent shadow-[0_0_15px_rgba(202,243,0,0.1)]" inputmode="numeric" maxlength="1" type="text" value="4"/>
<!-- Inactive Inputs -->
<input class="w-12 h-14 sm:w-16 sm:h-20 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-center font-display text-h1 sm:text-display text-on-surface focus:outline-none focus:border-primary-fixed focus:border-2 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-12 h-14 sm:w-16 sm:h-20 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-center font-display text-h1 sm:text-display text-on-surface focus:outline-none focus:border-primary-fixed focus:border-2 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-12 h-14 sm:w-16 sm:h-20 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-center font-display text-h1 sm:text-display text-on-surface focus:outline-none focus:border-primary-fixed focus:border-2 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-12 h-14 sm:w-16 sm:h-20 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-center font-display text-h1 sm:text-display text-on-surface focus:outline-none focus:border-primary-fixed focus:border-2 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-12 h-14 sm:w-16 sm:h-20 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-center font-display text-h1 sm:text-display text-on-surface focus:outline-none focus:border-primary-fixed focus:border-2 transition-colors" inputmode="numeric" maxlength="1" type="text"/></div>
<!-- Resend Action -->
<div class="text-center">
<button class="font-body-md text-body-md text-primary-fixed font-semibold hover:opacity-80 transition-opacity flex items-center justify-center gap-2 mx-auto">
<span class="material-symbols-outlined" style="font-size: 18px;">refresh</span>
                Resend Code
            </button>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-h2 text-h2 py-4 rounded-xl flex justify-center items-center hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-stack-sm shadow-[0_4px_20px_rgba(202,243,0,0.2)] border border-primary-fixed/20">
            Verify OTP
        </button>
</div>
