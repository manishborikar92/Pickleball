<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout - Downtown Padel Arena</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-surface-variant": "#c5c9ac",
                      "on-primary-fixed-variant": "#3e4c00",
                      "tertiary-container": "#e2e2e2",
                      "secondary-fixed-dim": "#c8c6c5",
                      "tertiary-fixed": "#e2e2e2",
                      "surface-container-lowest": "#0d0f04",
                      "on-tertiary": "#2f3131",
                      "on-secondary-fixed-variant": "#474646",
                      "outline": "#8f9378",
                      "surface-container-low": "#1a1d10",
                      "secondary-fixed": "#e5e2e1",
                      "surface-bright": "#383b2b",
                      "primary": "#ffffff",
                      "surface-tint": "#b0d500",
                      "primary-container": "#caf300",
                      "tertiary": "#ffffff",
                      "surface-variant": "#333627",
                      "surface-dim": "#121508",
                      "error-container": "#93000a",
                      "on-secondary-container": "#bab8b7",
                      "on-error": "#690005",
                      "outline-variant": "#444932",
                      "on-background": "#e2e4cf",
                      "tertiary-fixed-dim": "#c6c6c7",
                      "secondary": "#c8c6c5",
                      "surface-container-highest": "#333627",
                      "on-secondary": "#313030",
                      "inverse-surface": "#e2e4cf",
                      "error": "#ffb4ab",
                      "primary-fixed-dim": "#b0d500",
                      "on-tertiary-container": "#636565",
                      "inverse-on-surface": "#2f3223",
                      "surface-container": "#1e2113",
                      "background": "#121508",
                      "on-tertiary-fixed": "#1a1c1c",
                      "on-tertiary-fixed-variant": "#454747",
                      "on-surface": "#e2e4cf",
                      "secondary-container": "#4a4949",
                      "on-primary-container": "#596c00",
                      "primary-fixed": "#caf300",
                      "inverse-primary": "#536600",
                      "surface-container-high": "#292b1d",
                      "on-secondary-fixed": "#1c1b1b",
                      "surface": "#121508",
                      "on-primary": "#2a3400",
                      "on-error-container": "#ffdad6",
                      "on-primary-fixed": "#171e00"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "24px",
                      "section-gap": "40px",
                      "stack-sm": "8px",
                      "stack-md": "16px",
                      "gutter": "16px",
                      "container-padding": "24px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "h2": ["Outfit"],
                      "display": ["Outfit"],
                      "h1": ["Outfit"],
                      "body-lg": ["Inter"],
                      "label-caps": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                      "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen relative selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- BASE LAYER: Checkout Page Context (Behind Modal) -->
<div class="h-screen overflow-hidden flex flex-col">
<!-- Transactional TopAppBar (Modified for context) -->
<header class="flex justify-between items-center px-container-padding h-16 w-full bg-surface/80 backdrop-blur-lg border-b border-outline-variant/20 sticky top-0 z-30">
<button class="text-primary-fixed hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2 rounded-full active:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display font-bold text-on-surface text-h2 tracking-tight">Checkout</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-container-padding py-stack-lg max-w-2xl mx-auto w-full flex flex-col gap-section-gap pb-32">
<!-- Booking Summary Card -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-display text-h2 text-on-surface">Order Summary</h2>
<div class="bg-surface-container-low rounded-xl border border-outline-variant/30 overflow-hidden shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
<div class="h-32 w-full bg-surface-container relative">
<div class="absolute inset-0 bg-cover bg-center opacity-60" data-alt="A sleek, modern indoor padel court illuminated by intense, crisp overhead lighting against a dark charcoal environment. The bright lime green lines of the court stand out vibrantly against the dark playing surface, creating a high-end, energetic sports-tech atmosphere. The glass walls reflect the sophisticated lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDV33Iuv9MaBHJBSVkiF54ZbliiQ6-IURpjldZv8aYvlGHmissObqad_re3TEjf4g0i4QMVo_Uh676XNPdNPfM_vSn3tV9T8DefIWnPZHWEPMbRSoQQKnKPk3eCEZG03Zabp67rtD-TebZiewBhYJXssv2MrOVflm7PQTKUMdIiTf_ZUM_XWT34AXmMnnJg_NOSmP-rRrFKTzAxqWyQBXZiApNHCyH9nA__HLfZdMtXmqT_WRtbVHYFppoE_JFsSr7IOSfgLTgwjIo');"></div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent"></div>
</div>
<div class="p-stack-lg flex flex-col gap-stack-sm relative z-10 -mt-8">
<div class="flex items-center gap-2 mb-1">
<span class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-2 py-1 rounded-sm">PADEL</span>
</div>
<h3 class="font-h1 text-h1 text-on-surface">Downtown Padel Arena</h3>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-[20px]" data-icon="calendar_today">calendar_today</span>
                            Tomorrow, 18:00 - 19:30
                        </p>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="group">group</span>
                            Court 2 • 4 Players
                        </p>
</div>
</div>
</section>
<!-- Price Breakdown -->
<section class="bg-surface-container rounded-xl p-stack-lg flex flex-col gap-stack-md border border-outline-variant/20">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Court Booking (90 mins)</span>
<span class="font-body-md text-body-md">₹1,200</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Equipment Rental</span>
<span class="font-body-md text-body-md">₹300</span>
</div>
<div class="h-px w-full bg-outline-variant/30 my-2"></div>
<div class="flex justify-between items-center text-on-surface">
<span class="font-h2 text-h2">Total</span>
<span class="font-h1 text-h1 text-primary-fixed">₹1,500</span>
</div>
</section>
</main>
</div>
<!-- OVERLAY & BOTTOM SHEET MODAL (Active State) -->
<!-- The backdrop-blur and bg-surface/80 creates the "dimmed" effect -->
<div class="fixed inset-0 bg-background/85 backdrop-blur-sm z-50 flex flex-col justify-end md:justify-center md:items-center">
<!-- Bottom Sheet Container (Slides up on mobile, centered modal on desktop) -->
<div class="bg-surface-container-high w-full md:max-w-md md:rounded-2xl rounded-t-[24px] p-container-padding flex flex-col gap-section-gap shadow-[0_-10px_40px_rgba(0,0,0,0.5)] border-t md:border border-outline-variant/20">
<!-- Mobile Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/40 rounded-full mx-auto md:hidden -mt-2 mb-2"></div>
<!-- Content Header -->
<div class="flex flex-col gap-stack-sm text-center md:text-left mt-2 md:mt-0">
<h2 class="font-display text-display text-on-surface tracking-tight">Almost there!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us your name to finish your booking.</p>
</div>
<!-- Input Form -->
<form class="flex flex-col gap-stack-lg w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-body-md text-label-caps uppercase text-on-surface-variant tracking-wider" for="fullName">Full Name</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="person">person</span>
</span>
<input class="w-full bg-surface-container-highest border border-outline-variant/40 rounded-xl py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-all" id="fullName" name="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary-fixed text-on-primary-fixed hover:bg-primary-fixed/90 active:scale-[0.98] transition-all rounded-full py-4 px-6 font-body-md text-body-lg font-bold flex justify-center items-center gap-2 mt-4 shadow-[0_0_20px_rgba(202,243,0,0.15)]" type="submit">Next <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span></button>
</form>
</div>
</div>
</body></html>
