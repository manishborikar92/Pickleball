<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout - Verify to Book</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary": "#ffffff",

                        "primary-container": "#caf300",
                        "tertiary": "#ffffff",
                        "surface-variant": "#333627",
                        "surface-dim": "#121508",
                        "error-container": "#93000a",

                        "tertiary-fixed-dim": "#c6c6c7",
                        "secondary": "#c8c6c5",

                        "on-secondary": "#313030",
                        "inverse-surface": "#e2e4cf",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "section-gap": "40px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "container-padding": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "h2": ["Outfit"],
                        "display": ["Outfit"],
                        "h1": ["Outfit"],

                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],

                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444932; border-radius: 4px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Adapted for Transactional State) -->
<header class="bg-surface/80 backdrop-blur-lg border-b border-outline-variant/20 flex justify-between items-center px-container-padding h-16 w-full docked full-width top-0 sticky z-30">
<button class="text-primary-fixed scale-95 active:scale-90 transition-transform flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display text-h2 font-bold text-primary-fixed tracking-tight">Checkout</h1>
<div class="w-10"></div> <!-- Spacer to center title -->
</header>
<!-- Main Content (Dimmed via overlay) -->
<main class="pt-section-gap px-container-padding pb-32 max-w-lg mx-auto filter blur-[2px] opacity-60 pointer-events-none transition-all duration-300">
<!-- Summary Card -->
<div class="bg-surface-container-low rounded-xl p-stack-md border border-outline-variant/20 mb-stack-lg shadow-[0_8px_30px_rgba(0,0,0,0.1)] relative overflow-hidden">
<!-- Decorative background image for card -->
<div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center" data-alt="A sleek, modern indoor padel court viewed from slightly above, illuminated by professional sports lighting. The aesthetic is dark and premium, with deep charcoal surroundings and vibrant lime-green accent lines on the court surface. The atmosphere is energetic but pristine, capturing a high-tech 'neon-noir' sports environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDBS859BAd-HYP4ouO20viDx0_ucR1HF6o1GVuXKVMmhSEu25sUf1HZyf1532MkMPyLkwUlis4Hw6inyzheoGqea8_85ShqhbB3P380lClvQSWi-_d-co26RwqkoLqkqQxumCLcPdtXyZf2bSzZPswgqzb_L2NZ6NIYIgz-B65ZDC58WTUwmoa7syX9XnsIKPCSzCP7_KUzy7eUPsNQTda5BglMcpyF1XWsghdply7W0BopMeC-7_Pz7iPxFDeCOopYMfc-M_LEh0A');"></div>
<div class="relative z-10 flex flex-col gap-stack-sm">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-fixed fill text-[20px]">sports_tennis</span>
<span class="font-body-md text-label-caps text-primary-fixed uppercase tracking-widest">Premium Court</span>
</div>
<h2 class="font-display text-h1 text-on-surface">Downtown Padel Arena</h2>
<div class="flex items-center gap-stack-sm text-on-surface-variant mt-2">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="font-body-md text-body-md">Oct 24, 2023 • 18:00 - 19:30</span>
</div>
<div class="flex items-center gap-stack-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">group</span>
<span class="font-body-md text-body-md">4 Players (Double)</span>
</div>
</div>
</div>
<!-- Price Breakdown -->
<div class="flex flex-col gap-stack-sm px-2">
<h3 class="font-display text-h2 text-on-surface mb-stack-sm">Payment Summary</h3>
<div class="flex justify-between items-center text-on-surface-variant font-body-md text-body-md">
<span>Court Booking (90 mins)</span>
<span>₹2,400</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant font-body-md text-body-md">
<span>Taxes &amp; Fees</span>
<span>₹120</span>
</div>
<div class="h-[1px] w-full bg-outline-variant/30 my-stack-sm"></div>
<div class="flex justify-between items-center font-display text-h2 text-primary-fixed">
<span>Total</span>
<span>₹2,520</span>
</div>
</div>
</main>
<!-- Bottom Sheet Overlay -->
<div class="fixed inset-0 bg-surface-container-lowest/80 backdrop-blur-md z-40 flex flex-col justify-end">
<!-- Bottom Sheet Container -->
<div class="bg-surface-container-high w-full rounded-t-[32px] border-t border-outline-variant/20 shadow-[0_-20px_60px_rgba(0,0,0,0.6)] pt-stack-md pb-[max(24px,env(safe-area-inset-bottom))] px-container-padding flex flex-col gap-stack-lg animate-[slideUp_0.3s_ease-out]">
<!-- Drag Handle (Visual only) -->
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto mb-stack-sm"></div>
<!-- Header Content -->
<div class="flex flex-col gap-stack-sm text-center">
<div class="w-16 h-16 bg-primary-container/10 rounded-full flex items-center justify-center mx-auto mb-2">
<span class="material-symbols-outlined text-[32px] text-primary-fixed fill">phone_iphone</span>
</div>
<h2 class="font-display text-h1 text-on-surface tracking-tight">Verify to Book</h2>
<p class="font-body-md text-body-md text-on-surface-variant px-4">
                    Enter your phone number to receive a 4-digit code.
                </p>
</div>
<!-- Input Area -->
<div class="mt-stack-sm">
<div class="flex items-stretch bg-surface-container-highest rounded-xl border border-outline-variant/30 focus-within:border-primary-fixed/50 focus-within:ring-1 focus-within:ring-primary-fixed/30 transition-all duration-300 overflow-hidden group">
<!-- Country Code -->
<div class="flex items-center gap-2 px-5 bg-surface-container-highest/50 text-on-surface font-body-md text-body-md font-medium select-none group-focus-within:text-primary-fixed transition-colors">
<span class="text-xl">🇮🇳</span>
<span class="tracking-wide">+91</span>
<div class="h-6 w-[1px] bg-outline-variant/30 ml-2"></div>
</div>
<!-- Phone Input -->
<input autocomplete="tel-national" class="w-full bg-transparent border-none text-on-surface font-body-md text-body-lg placeholder:text-on-surface-variant/40 px-4 py-4 focus:outline-none focus:ring-0" placeholder="98765 43210" type="tel"/>
</div>
</div>
<!-- Action Area -->
<div class="mt-auto pt-stack-sm">
<button class="w-full bg-primary-container text-on-primary-container font-body-md text-body-md font-semibold py-4 rounded-xl flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-[0_0_20px_rgba(202,243,0,0.15)] group">
<span>Send OTP</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</body></html>
